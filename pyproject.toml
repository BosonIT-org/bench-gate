[project]
name = "bench-gate"
version = "0.1.1"
description = "Rerun a noisy CI benchmark only until an anytime-valid test decides: pass, fail, or honestly inconclusive."
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bench-gate = "bench_gate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bench_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
